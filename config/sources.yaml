  - {slug: amr,      name: Academy of Management Review,     category: management_journal, issn: ["0363-7425", "1930-3807"], tier: A, url: https://journals.aom.org/journal/amr}
  - {slug: orgsci,   name: Organization Science,             category: management_journal, issn: ["1047-7039", "1526-5455"], tier: A, url: https://pubsonline.informs.org/journal/orsc}
