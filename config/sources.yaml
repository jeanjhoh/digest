# Watch list for the weekly digest.
# tier A: every non-front-matter paper goes to the LLM classifier (top journals, by prestige)
# tier B: keyword-gated (min_score 2)
# tier C: strict keyword gate (min_score 5) for high-volume or mostly off-topic venues
# kinds: crossref_journal (issn), crossref_prefix (prefix), arxiv (query), repec_nep (report), gsheet
defaults:
  kind: crossref_journal
  enabled: true
tiers:
  A: {always_candidate: true, min_score: 0}
  B: {always_candidate: false, min_score: 2}
  C: {always_candidate: false, min_score: 5}

sources:
  # ---- Tier A: top journals ----
  - {slug: asq,      name: Administrative Science Quarterly, category: management_journal, issn: ["0001-8392", "1930-3815"], tier: A, url: https://journals.sagepub.com/home/asq}
