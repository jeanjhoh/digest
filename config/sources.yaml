  # ---- Working papers, preprints, alerts ----
  - {slug: alerts,   name: SSRN and Google Scholar alerts,    kind: gsheet,          category: alert,         tier: A, url: https://www.ssrn.com/}
  - {slug: socarxiv, name: SocArXiv,                            kind: osf_preprints,   category: preprint,      tier: B, provider: socarxiv, url: https://osf.io/preprints/socarxiv}
  - {slug: nep-ent,  name: "NEP: Entrepreneurship",             kind: repec_nep,       category: working_paper, tier: A, report: nep-ent, url: https://nep.repec.org/nep-ent.html}
  - {slug: nber,     name: NBER Working Papers,                 kind: crossref_prefix, category: working_paper, tier: B, prefix: "10.3386", url: https://www.nber.org/papers}
  - {slug: arxiv-econ-gn, name: "arXiv econ.GN",                kind: arxiv,           category: preprint,      tier: B, query: "cat:econ.GN", url: https://arxiv.org/list/econ.GN/recent}
  - {slug: arxiv-ai-work, name: "arXiv cs.AI / cs.HC / cs.CL (work-related)", kind: arxiv, category: preprint, tier: C,
     query: '(cat:cs.AI OR cat:cs.HC OR cat:cs.CL) AND (abs:"labor market" OR abs:workers OR abs:occupations OR abs:entrepreneurs OR abs:"knowledge work" OR abs:productivity OR abs:hiring OR abs:workplace OR abs:"future of work")',
     url: https://arxiv.org/list/cs.AI/recent}
