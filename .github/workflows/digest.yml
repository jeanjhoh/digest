name: weekly-digest

on:
  schedule:
    - cron: "0 10 * * 3"          # Wednesday 10:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days (blank = settings default 8, or 14 with bootstrap)"
        default: ""
      dry_run:
        description: "Fetch and classify but do not commit or deploy"
        type: boolean
        default: false
      bootstrap:
        description: "First run: 14-day window, creates Issue 1"
        type: boolean
        default: false
      no_llm:
        description: "Skip the LLM classification stage"
        type: boolean
        default: false
      sources:
        description: "Comma-separated source slugs (blank = all)"
        default: ""
      llm_limit:
        description: "Max LLM batches (blank = all); use 1 with dry_run to preview notes cheaply"
        default: ""
      preview:
        description: "Run for real but upload data/ as an artifact instead of committing; no deploy"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sitebuilder/**"
      - "data/published/**"
      - ".github/workflows/digest.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Anthropic auth via Workload Identity Federation: the job's GitHub OIDC token is exchanged for a
      # short-lived access token at run time (no API key secret). IDs are not secrets.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01MPM2FXmg5NTzvnVFzzudwa
      ANTHROPIC_ORGANIZATION_ID: ae7c9a27-97a4-44cc-9f0b-38f64a414125
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JSGAS3eCJfJ6KUJR2p5TwC
      ANTHROPIC_WORKSPACE_ID: wrkspc_01HgcTLCNLZCWzVANd3fbTPy
      GSHEET_CSV_URL: ${{ secrets.GSHEET_CSV_URL }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Show OIDC token claims (for federation-rule debugging; the token itself is not printed)
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | python -c 'import sys,json,base64; t=json.load(sys.stdin)["value"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(t+"="*(-len(t)%4))); print(json.dumps({k:c.get(k) for k in ["iss","sub","aud","ref","ref_type","event_name","repository","repository_owner","repository_owner_id","repository_id","repository_visibility","workflow_ref","job_workflow_ref","environment","actor"]}, indent=2))'
      - name: Check sources
        run: python -m digest sources check
      - name: Run pipeline
        run: |
          ARGS=""
          if [ -n "${{ inputs.days }}" ]; then ARGS="$ARGS --days ${{ inputs.days }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.bootstrap }}" = "true" ]; then ARGS="$ARGS --bootstrap"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ -n "${{ inputs.llm_limit }}" ]; then ARGS="$ARGS --llm-limit ${{ inputs.llm_limit }}"; fi
          echo "python -m digest run $ARGS"
          python -m digest run $ARGS
      - name: Publish site data
        if: ${{ inputs.dry_run != true }}
        run: python -m digest publish
      - name: Upload data as preview artifact
        if: ${{ inputs.preview == true && inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-data
          path: data
          retention-days: 7
      - name: Commit data
        if: ${{ inputs.dry_run != true && inputs.preview != true }}
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "$(python -m digest commit-message)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    needs: pipeline
    if: ${{ always() && (needs.pipeline.result == 'success' || needs.pipeline.result == 'skipped') && inputs.dry_run != true && inputs.preview != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_data: ${{ steps.data.outputs.has_data }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check for published data
        id: data
        run: |
          if [ -f data/published/meta.json ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No data/published/meta.json yet; run the pipeline (bootstrap) before the site can be built."
          fi
      - uses: actions/setup-python@v5
        if: steps.data.outputs.has_data == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.data.outputs.has_data == 'true'
        run: pip install -r requirements.txt
      - name: Build site
        if: steps.data.outputs.has_data == 'true'
        run: |
          python -m sitebuilder build --data data/published --out site --site-url "${{ vars.SITE_URL || 'https://jeanjhoh.github.io/digest/' }}"
          python -m sitebuilder check site
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.has_data == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.has_data == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
