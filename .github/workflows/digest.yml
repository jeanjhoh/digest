name: weekly-digest

on:
  schedule:
    - cron: "0 10 * * 3"          # Wednesday 10:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        default: "8"
      dry_run:
        description: "Fetch and classify but do not commit or deploy"
        type: boolean
        default: false
      bootstrap:
        description: "First run: 14-day window, creates Issue 1"
        type: boolean
        default: false
      no_llm:
        description: "Skip the LLM classification stage"
        type: boolean
        default: false
      sources:
        description: "Comma-separated source slugs (blank = all)"
        default: ""
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sitebuilder/**"
      - "data/published/**"
      - ".github/workflows/digest.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GSHEET_CSV_URL: ${{ secrets.GSHEET_CSV_URL }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check sources
        run: python -m digest sources check
      - name: Run pipeline
        run: |
          ARGS="--days ${{ inputs.days || '8' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.bootstrap }}" = "true" ]; then ARGS="$ARGS --bootstrap"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          echo "python -m digest run $ARGS"
          python -m digest run $ARGS
      - name: Publish site data
        if: ${{ inputs.dry_run != true }}
        run: python -m digest publish
      - name: Commit data
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "$(python -m digest commit-message)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    needs: pipeline
    if: ${{ always() && (needs.pipeline.result == 'success' || needs.pipeline.result == 'skipped') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        run: |
          python -m sitebuilder build --data data/published --out site --site-url "${{ vars.SITE_URL || 'https://jeanjhoh.github.io/digest/' }}"
          python -m sitebuilder check site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
