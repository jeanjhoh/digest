{% extends "base.html" %}
{% block main %}
<header class="digest-head">
  <h1 class="digest-title"><a href="{{ rel }}index.html">{{ site.title }}</a></h1>
  <p class="issue-line">Sources</p>
  <p><a href="{{ rel }}index.html" class="back-link">&larr; Back to the latest issue</a></p>
</header>
{% for g in source_groups %}
<section class="cat">
  <h2>{{ g.label }}</h2>
  <div class="cat-body"><ul class="sources-page-list">
  {% for s in g.sources if s.enabled %}
    <li id="src-{{ s.slug }}">{% if s.url %}<a href="{{ s.url }}" target="_blank" rel="noopener">{{ s.name }}</a>{% else %}{{ s.name }}{% endif %}</li>
  {% endfor %}
  </ul></div>
</section>
{% endfor %}
{% endblock %}
